<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --text: #333;
            --accent: #e100ff;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 { font-weight: 700; margin-bottom: 10px; }
        p { color: #666; }

        /* The Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        /* Project Cards */
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #eee;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
            display: block;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border-color: var(--accent);
        }

        .card h3 {
            margin: 0 0 10px 0;
            color: var(--accent);
        }

        .card p {
            font-size: 0.9rem;
            margin: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Welcome to My Webpage</h1>
        <p>A collection notes and links.</p>
    </header>

    <main class="grid">
        <a href="pages/resume.html" class="card">
            <h3>My Resume</h3>
            <p>A pdf of my current best resume</p>
        </a>

        <a href="pages/coupecosts.html" class="card">
            <h3>Daytona Coupe</h3>
            <p>A brief look at costs and values of factory five type 65 coupe kits.</p>
        </a>

        <a href="pages/svoirs.html" class="card">
            <h3>Plot it irs the svo</h3>
            <p>A page to stop the irs snowball.</p>
        </a>

        </main>
</div>

</body>
</html>
